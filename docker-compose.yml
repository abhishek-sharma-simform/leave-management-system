services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leave_management
    ports:
      # Host port 5433 avoids colliding with a locally-installed Postgres on
      # the default 5432; the api container still reaches this over 5432 on
      # the compose network regardless of the host mapping.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      # Must point at the `db` compose service name, not localhost — the api
      # container reaches Postgres over the compose network, not the host.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/leave_management
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production

volumes:
  pgdata:
